<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grade 12 Lessons</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f8ff; }
    h1 { background-color: #003366; color: white; padding: 20px; }
    .tab { margin: 20px; }
    .icon-button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin: 5px;
      border-radius: 5px;
      font-size: 14px;
    }
    .icon-button:hover { background-color: #0b7dda; }
    .content {
      padding: 10px;
      background-color: #f9f9f9;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      text-align: left;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>

<h1>Grade 12 Mathematics</h1>

<!-- ================= Chap1: Continuous Function ================= -->
<div class="tab">
  <h2>📘 Chap1: Continuous Function over an Interval</h2>
  <button class="icon-button" onclick="showContent('contifc')">📄 Course</button>
  <button class="icon-button" onclick="showContent('contifp')">📝 Exercises</button>
</div>

<div id="contifc" class="content" style="display:none;">
  <h3>Continuous Function Course</h3>
  <iframe src="contif/contifc.pdf"></iframe>
</div>

<div id="contifp" class="content" style="display:none;">
  <h3>Continuous Function Exercises</h3>
  <iframe src="contif/contifp.pdf"></iframe>
</div>

<!-- ================= Chap2: Logarithmic Functions ================= -->
<div class="tab">
  <h2>📘 Chap2: Logarithmic Functions</h2>
  <button class="icon-button" onclick="showContent('lnc')">📄 Course</button>
  <button class="icon-button" onclick="showContent('lnp')">📝 Exercises</button>
</div>

<div id="lnc" class="content" style="display:none;">
  <h3>Logarithmic Functions Course</h3>
  <iframe src="ln/lnc.pdf"></iframe>
</div>

<div id="lnp" class="content" style="display:none;">
  <h3>Logarithmic Functions Exercises</h3>
  <iframe src="ln/lnp.pdf"></iframe>
</div>

<script>
function showContent(id) {
  const sections = ['contifc','contifp','lnc','lnp'];
  sections.forEach(sec => {
    const el = document.getElementById(sec);
    if (el) el.style.display = 'none';
  });
  const target = document.getElementById(id);
  if (target) target.style.display = 'block';
}
</script>

</body>
</html>
